<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post / Gather</title>
  <meta name="description" content="View post and replies on Gather.">
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="stylesheet" href="./src/css/main.css">
  <link rel="stylesheet" href="./src/css/layout.css">
  <link rel="stylesheet" href="./src/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-wrapper">
    <div class="app-container">
      <div id="sidebar-left-container"></div>

      <main class="main-feed-container">
        <header class="page-header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <a href="javascript:history.back()" style="color: var(--color-text-muted); display: flex; align-items: center;">
              <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
            </a>
            <h1 class="page-title">Post</h1>
          </div>
        </header>

        <!-- Main Post Details -->
        <div id="single-post-container">
          <div class="loading-box">Loading post...</div>
        </div>

        <!-- Add Comment Input Box -->
        <div style="padding: 16px 20px; border-bottom: 1px solid var(--color-border-light); background: var(--color-surface);">
          <form id="add-comment-form" class="comment-input-box" style="margin-bottom: 0;">
            <input type="text" id="comment-input-field" class="comment-input" placeholder="Post your reply..." required>
            <button type="submit" class="btn btn-primary btn-sm">Reply</button>
          </form>
        </div>

        <!-- Replies / Comments List -->
        <div id="comments-list-container">
          <div class="loading-box">Loading comments...</div>
        </div>
      </main>

      <div id="sidebar-right-container"></div>
    </div>
  </div>

  <div id="mobile-nav-container"></div>

  <script type="module" src="./src/js/pages/post-page.js"></script>
</body>
</html>
